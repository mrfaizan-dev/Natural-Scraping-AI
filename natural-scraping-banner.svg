<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
  <title id="title">Natural Scraping AI - Live Project Demo</title>
  <desc id="desc">Banner for a live video walkthrough of Natural Scraping AI, with a YouTube-style play button.</desc>

  <defs>
    <radialGradient id="glowBlue" gradientUnits="userSpaceOnUse" cx="600" cy="90" r="230">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" gradientUnits="userSpaceOnUse" cx="710" cy="185" r="170">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" gradientUnits="userSpaceOnUse" cx="615" cy="121" r="64">
      <stop offset="0" stop-color="#FF0000" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FF0000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E293B" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="14" fill="#090D16"/>
  <rect width="800" height="220" rx="14" fill="url(#glowBlue)"/>
  <rect width="800" height="220" rx="14" fill="url(#glowGreen)"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Left column: status badge -->
    <rect x="40" y="28" width="178" height="26" rx="13" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.35"/>
    <circle cx="56" cy="41" r="3.5" fill="#10B981"/>
    <text x="68" y="45" font-size="11" font-weight="700" letter-spacing="1" fill="#10B981">LIVE PROJECT DEMO</text>

    <!-- Title -->
    <text x="40" y="94" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#F8FAFC">Natural Scraping AI</text>

    <!-- Subtitle -->
    <text x="40" y="121" font-size="13.5" fill="#94A3B8">Watch multi-engine browser automation,</text>
    <text x="40" y="140" font-size="13.5" fill="#94A3B8">live task tracking &amp; Excel export run end-to-end.</text>

    <!-- Call to action -->
    <text x="40" y="188" font-size="13.5" font-weight="600" fill="#38BDF8">Click to watch live execution →</text>
  </g>

  <!-- Right column: glass preview window -->
  <rect x="470" y="28" width="290" height="164" rx="12" fill="url(#glass)" stroke="url(#glassEdge)"/>

  <!-- Window chrome -->
  <circle cx="487" cy="39" r="3" fill="#475569"/>
  <circle cx="499" cy="39" r="3" fill="#475569"/>
  <circle cx="511" cy="39" r="3" fill="#475569"/>
  <rect x="528" y="33" width="216" height="12" rx="6" fill="#0F172A" stroke="#1E293B"/>
  <line x1="471" y1="50" x2="759" y2="50" stroke="#1E293B"/>

  <!-- Data rows (top) -->
  <circle cx="488" cy="62" r="2.5" fill="#10B981"/>
  <line x1="498" y1="62" x2="618" y2="62" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="696" y1="62" x2="744" y2="62" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="488" cy="72" r="2.5" fill="#3B82F6"/>
  <line x1="498" y1="72" x2="578" y2="72" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="712" y1="72" x2="744" y2="72" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Data rows (bottom) -->
  <circle cx="488" cy="170" r="2.5" fill="#10B981"/>
  <line x1="498" y1="170" x2="598" y2="170" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="704" y1="170" x2="744" y2="170" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="488" cy="180" r="2.5" fill="#3B82F6"/>
  <line x1="498" y1="180" x2="560" y2="180" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="696" y1="180" x2="744" y2="180" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Play button: soft glow, ring, button, triangle -->
  <circle cx="615" cy="121" r="64" fill="url(#glowRed)"/>
  <rect x="567" y="84" width="96" height="74" rx="25" fill="none" stroke="#FF0000" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="579" y="96" width="72" height="50" rx="14" fill="#FF0000"/>
  <polygon points="607,108 607,134 630,121" fill="#FFFFFF"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="799" height="219" rx="13.5" fill="none" stroke="#1E293B"/>
</svg>
