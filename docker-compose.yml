services:
  redis:
    image: redis:alpine
    container_name: redis_container
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8800:8800"
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn api_main:app --host 0.0.0.0 --port 8800
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - backend
    restart: always

  frontend:
    build:
      context: ./scraper-frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./scraper-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - PORT=3000
    restart: always
